<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Quest · 像素大冒险</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%235c94fc'/><rect x='4' y='3' width='8' height='6' fill='%23f8c020'/><rect x='5' y='5' width='6' height='2' fill='%23a06808'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="320" height="240"></canvas>
</div>

<!-- 触屏虚拟按键（仅触屏设备显示） -->
<div id="touch">
  <div class="pad">
    <button id="t-left" class="tbtn" aria-label="左">&#9664;</button>
    <button id="t-right" class="tbtn" aria-label="右">&#9654;</button>
  </div>
  <div class="act">
    <button id="t-run" class="tbtn round">B</button>
    <button id="t-jump" class="tbtn round">A</button>
  </div>
</div>
<button id="t-pause" class="tbtn mini" aria-label="暂停">II</button>

<script src="js/sprites.js" charset="utf-8"></script>
<script src="js/levels.js" charset="utf-8"></script>
<script src="js/audio.js" charset="utf-8"></script>
<script src="js/game.js" charset="utf-8"></script>
</body>
</html>
